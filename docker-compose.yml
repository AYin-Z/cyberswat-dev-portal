# CyberSWAT 开发部子站 — 生产部署
# 架构: dev.cyberswat.cn → CF Tunnel → 8092 nginx → dev-web(静态) + dev-api(内网 8093) + dev-db(内网 5432)
# 构建策略沿用主站: 宿主 pnpm build → 镜像 COPY dist（容器内不做 npm，规避 fake-ip 坑）

services:
  dev-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: cyberswat-dev-web
    restart: unless-stopped
    ports:
      - '127.0.0.1:8092:80'
    depends_on:
      - dev-api
    # 与 dev-api 同处 cyberdev 网络：nginx 反代 dev-api:8093 需在同一自定义网络内解析
    networks:
      - cyberdev

  dev-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: cyberswat-dev-api
    restart: unless-stopped
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET 必须设置}
      - DATABASE_URL=postgresql://${DB_USER:-cyberswat}:${DB_PASSWORD:?DB_PASSWORD 必须设置}@${DB_HOST:-dev-db}:${DB_PORT:-5432}/${DB_NAME:-cyberswat_dev}?schema=public
      - API_PORT=8093
      - FRONTEND_ORIGIN=https://dev.cyberswat.cn
      - PUBLIC_API_URL=https://dev.cyberswat.cn
      # GitHub OAuth（创建 OAuth App 后填入 .env）
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
    depends_on:
      - dev-db
    # 不暴露宿主端口：仅 nginx(dev-web) 内网反代
    networks:
      cyberdev:
        aliases:
          - dev-api

  dev-db:
    image: postgres:16-alpine
    container_name: cyberswat-dev-db-prod
    restart: unless-stopped
    environment:
      - POSTGRES_USER=cyberswat
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD 必须设置}
      - POSTGRES_DB=cyberswat_dev
    volumes:
      - cyberdev-pgdata:/var/lib/postgresql/data
    networks:
      - cyberdev

volumes:
  cyberdev-pgdata:

networks:
  cyberdev:
    driver: bridge
